<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>レコード屋 路地灯</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=BIZ+UDPGothic:wght@400;700&family=Dela+Gothic+One&family=DotGothic16&family=Zen+Kurenaido&display=swap">
<style>
/* 店内：深い緑の壁、クラフト紙の値札、黄色いPOP、赤い値札シール
   バックヤードPC：くすんだ灰青のデスクトップ、古いブラウザ */
:root{
  --wall:#20332c; --wall-2:#294238; --wall-3:#33503f;
  --kraft:#e4d4b1; --kraft-2:#d3c094; --ink:#33281a; --ink-soft:#6b5a40;
  --pop:#f0cf4a; --sticker:#d4452a; --ok:#7fb069; --chalk:#eef0e6; --chalk-dim:#a9b8ad;
  --desk:#4d5c66; --desk-2:#3c4950; --bezel:#cfc6b2; --win:#f4f1ea; --win-ink:#22262a; --win-line:#c9c2b2; --link:#2f5f8a;
  --f-sign:"Dela Gothic One","Hiragino Sans","Yu Gothic",sans-serif;
  --f-hand:"Zen Kurenaido","Hiragino Maru Gothic ProN","Yu Gothic",sans-serif;
  --f-body:"BIZ UDPGothic","Hiragino Sans","Yu Gothic",sans-serif;
  --f-dot:"DotGothic16","Courier New",monospace;
  color-scheme:dark;
}
*{box-sizing:border-box}
/* display指定した要素にも hidden 属性を確実に効かせる */
[hidden]{display:none!important}
html,body{height:100%}
body{margin:0;background:var(--wall);color:var(--chalk);font-family:var(--f-body);font-size:15px;line-height:1.6}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,[tabindex]:focus-visible{outline:2px dashed var(--pop);outline-offset:3px}
.app{min-height:100%;display:grid;grid-template-rows:auto 1fr;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:12px 24px;gap:14px}

/* ===== 上部バー ===== */
.bar{display:flex;flex-wrap:wrap;align-items:center;gap:10px 22px;border-bottom:2px solid var(--wall-3);padding-bottom:10px}
.sign{font-family:var(--f-sign);font-size:22px;letter-spacing:.06em;color:var(--pop);transform:rotate(-1.5deg);margin-right:auto}
.sign small{font-family:var(--f-hand);font-size:13px;color:var(--chalk-dim);margin-left:8px;letter-spacing:0}
.stat{display:flex;flex-direction:column;line-height:1.15}
.stat b{font-weight:400;font-size:11px;color:var(--chalk-dim);letter-spacing:.1em}
.stat span{font-family:var(--f-dot);font-size:20px;font-variant-numeric:tabular-nums}
.clock span{font-size:26px;color:var(--pop)}
.clock em{font-style:normal;font-family:var(--f-dot);font-size:12px;color:var(--chalk-dim)}
.phase-tag{font-family:var(--f-hand);font-size:14px;padding:2px 10px;border:1.5px solid currentColor;border-radius:3px;transform:rotate(2deg)}
.phase-tag.open{color:var(--ok)} .phase-tag.prep{color:var(--pop)} .phase-tag.closed{color:var(--sticker)}
.btn{background:var(--kraft);color:var(--ink);border:0;border-radius:3px;padding:8px 16px;font-weight:700;box-shadow:0 3px 0 var(--kraft-2);transition:transform .08s}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--kraft-2)}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.btn.go{background:var(--pop)}
.btn.ghost{background:transparent;color:var(--chalk);box-shadow:none;border:1.5px solid var(--wall-3)}
.btn.pc{background:var(--desk);color:var(--chalk);box-shadow:0 3px 0 var(--desk-2)}
.debug{display:flex;gap:6px}

/* ===== 本体 ===== */
.main{display:grid;grid-template-columns:minmax(300px,380px) 1fr;gap:18px;align-items:start;min-height:0}
@media (max-width:820px){.main{grid-template-columns:1fr}}
.counter{background:var(--wall-2);border-radius:4px;padding:14px;display:flex;flex-direction:column;gap:12px;min-width:0}
.counter h2{margin:0;font-family:var(--f-sign);font-weight:400;font-size:16px;letter-spacing:.08em}
.speech{background:var(--kraft);color:var(--ink);border-radius:2px;padding:14px 16px 16px;min-height:118px;position:relative;transform:rotate(-.6deg)}
.speech::after{content:"";position:absolute;left:28px;bottom:-10px;border:10px solid transparent;border-top-color:var(--kraft);border-bottom:0}
.speech .who{font-size:12px;color:var(--ink-soft);display:flex;justify-content:space-between;gap:8px}
.speech .line{font-family:var(--f-hand);font-size:21px;line-height:1.45;margin-top:4px;text-wrap:balance}
.speech .empty{font-family:var(--f-hand);font-size:17px;color:var(--ink-soft)}
.kt{display:inline-block;opacity:0;animation:kt-in .42s cubic-bezier(.2,.9,.3,1.3) forwards;animation-delay:calc(var(--i) * 34ms);transform-origin:50% 80%}
@keyframes kt-in{from{opacity:0;transform:translateY(-.7em) rotate(var(--r)) scale(1.3)}to{opacity:1;transform:translateY(0) rotate(calc(var(--r) * .15)) scale(1)}}
.queue{display:flex;flex-direction:column;gap:8px}
.cust{display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:10px;padding:8px 10px;background:var(--wall);border:1.5px solid transparent;border-radius:3px;text-align:left;width:100%}
.cust.sel{border-color:var(--pop)}
.cust .face{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-sign);font-size:14px;color:var(--wall)}
.cust .nm{font-size:13px}
.cust .pat{height:5px;background:var(--wall-3);border-radius:3px;overflow:hidden;margin-top:4px}
.cust .pat i{display:block;height:100%;background:var(--ok);transition:width .4s linear}
.cust .pat i.low{background:var(--sticker)}
.cust .bud{font-family:var(--f-dot);font-size:13px;color:var(--chalk-dim)}
.queue-empty{font-size:13px;color:var(--chalk-dim);padding:6px 2px}
.log{font-size:12.5px;color:var(--chalk-dim);display:flex;flex-direction:column;gap:2px;max-height:150px;overflow:auto;border-top:1px dashed var(--wall-3);padding-top:8px}
.log .g{color:var(--ok)} .log .b{color:#e98f7c}

.floor{display:flex;flex-direction:column;gap:12px;min-width:0}
.crumbs{display:flex;flex-wrap:wrap;align-items:center;gap:6px;font-size:13.5px;color:var(--chalk-dim);list-style:none;margin:0;padding:0}
.crumbs li{display:flex;align-items:center;gap:6px}
.crumbs li+li::before{content:"＞";opacity:.5}
.crumbs button{background:none;border:0;padding:2px 0;color:var(--pop);text-decoration:underline;text-underline-offset:3px}
.crumbs [aria-current]{color:var(--chalk)}
.tools{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.dd{position:relative}
.dd-btn{background:var(--wall-2);border:1.5px solid var(--wall-3);border-radius:3px;padding:6px 12px;min-width:150px;text-align:left;display:flex;justify-content:space-between;gap:10px}
.dd-btn::after{content:"▾";color:var(--pop);transition:transform .2s}
.dd.open .dd-btn::after{transform:rotate(180deg)}
.dd-btn small{color:var(--chalk-dim);font-size:11px;margin-right:6px}
.dd-list{position:absolute;z-index:20;top:calc(100% + 4px);left:0;min-width:100%;margin:0;padding:4px;list-style:none;background:var(--kraft);color:var(--ink);border-radius:3px;box-shadow:0 8px 20px rgba(0,0,0,.35);transform-origin:top;animation:dd-in .16s ease-out;max-height:240px;overflow:auto}
@keyframes dd-in{from{opacity:0;transform:scaleY(.6)}to{opacity:1;transform:none}}
.dd-list li button{width:100%;text-align:left;background:none;border:0;padding:6px 10px;border-radius:2px}
.dd-list li button:hover,.dd-list li button[aria-selected="true"]{background:var(--kraft-2)}
.crates{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:14px}
.crate{background:var(--wall-2);border:0;border-radius:4px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:10px;transition:transform .15s}
.crate:hover{transform:translateY(-3px) rotate(-.4deg)}
.crate .pop{align-self:flex-start;background:var(--pop);color:var(--ink);font-family:var(--f-hand);font-size:17px;padding:2px 10px;transform:rotate(-2deg)}
.crate .stack{display:flex;height:70px}
.crate .stack span{flex:1;border-radius:2px 2px 0 0;margin-right:-6px;box-shadow:-2px 0 0 rgba(0,0,0,.25)}
.crate .meta{font-size:12.5px;color:var(--chalk-dim)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:16px}
.rec{background:none;border:0;padding:0;text-align:left;display:flex;flex-direction:column;gap:6px;transition:transform .15s;position:relative}
.rec:hover{transform:translateY(-4px) rotate(var(--tilt))}
.rec .cover{aspect-ratio:1;width:100%;max-width:100%;border-radius:2px;overflow:hidden;box-shadow:0 4px 0 rgba(0,0,0,.25);display:block}
.rec .cover svg{display:block;width:100%;height:100%}
.rec .t{font-size:13px;line-height:1.35}
.rec .a{font-size:11.5px;color:var(--chalk-dim)}
.price{position:absolute;top:-6px;right:-6px;background:var(--sticker);color:#fff;font-family:var(--f-dot);font-size:12px;padding:2px 6px;border-radius:50%/40%;transform:rotate(8deg)}
.rec.out .cover{filter:grayscale(1) brightness(.55)}
.rec.out::after{content:"品切れ";position:absolute;top:34%;left:50%;transform:translateX(-50%) rotate(-8deg);font-family:var(--f-sign);font-size:18px;color:var(--sticker);border:2px solid var(--sticker);padding:0 8px;background:rgba(32,51,44,.8)}
.pager{display:flex;flex-wrap:wrap;gap:6px;align-items:center;justify-content:center;padding-top:4px}
.pager button{min-width:36px;height:36px;border-radius:3px;border:1.5px solid var(--wall-3);background:var(--wall-2)}
.pager button[aria-current="page"]{background:var(--pop);color:var(--ink);border-color:var(--pop);transform:rotate(-3deg)}
.pager button[disabled]{opacity:.35;cursor:not-allowed}
.hint{font-size:12.5px;color:var(--chalk-dim)}
.nohit{font-family:var(--f-hand);font-size:17px;color:var(--chalk-dim);padding:30px 0;text-align:center}

/* ===== モーダル ===== */
.veil{position:fixed;inset:0;z-index:80;background:rgba(10,18,15,.72);display:grid;place-items:center;padding:20px max(16px,env(safe-area-inset-left,0px));animation:fade .18s}
@keyframes fade{from{opacity:0}}
.modal{background:var(--kraft);color:var(--ink);border-radius:3px;width:min(720px,100%);max-height:calc(100% - 20px);overflow:auto;padding:20px;display:grid;grid-template-columns:220px 1fr;gap:20px;animation:pop-in .26s cubic-bezier(.2,.9,.3,1.2)}
@keyframes pop-in{from{opacity:0;transform:translateY(16px) rotate(-1deg) scale(.96)}}
@media (max-width:620px){.modal{grid-template-columns:1fr}}
.modal .cover{width:100%;max-width:100%;aspect-ratio:1;box-shadow:0 6px 0 var(--kraft-2);transform:rotate(-1.5deg)}
.modal .cover svg{width:100%;height:100%;display:block}
.modal h3{margin:0;font-family:var(--f-sign);font-weight:400;font-size:22px;line-height:1.3;text-wrap:balance}
.modal .by{color:var(--ink-soft);margin-bottom:8px}
.chips{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.chip{font-family:var(--f-hand);font-size:14px;background:var(--pop);padding:0 8px;border-radius:2px;color:var(--ink)}
.chip.g{background:var(--ink);color:var(--kraft)}
.kv{font-size:13px;display:flex;flex-wrap:wrap;gap:4px 14px;color:var(--ink-soft)}
.kv b{color:var(--ink);font-family:var(--f-dot);font-weight:400;font-size:16px}
.acc{margin-top:12px;border-top:1.5px solid var(--kraft-2)}
.acc-head{width:100%;background:none;border:0;padding:10px 0;display:flex;justify-content:space-between;font-weight:700;color:inherit;text-align:left}
.acc-head::after{content:"＋";transition:transform .25s}
.acc-head[aria-expanded="true"]::after{transform:rotate(45deg)}
.acc-body{display:grid;grid-template-rows:0fr;transition:grid-template-rows .3s ease}
.acc-body.open{grid-template-rows:1fr}
.acc-body>div{overflow:hidden}
.acc-body ol{margin:0 0 10px;padding-left:1.6em;font-size:14px}
.acc-body li{padding:2px 0;border-bottom:1px dotted var(--kraft-2)}
.modal-actions{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px;align-items:center}
.modal-actions .btn{box-shadow:0 3px 0 rgba(0,0,0,.2)}
.modal-actions .btn.go{background:var(--ink);color:var(--pop)}
.modal-actions .note{font-size:12.5px;color:var(--ink-soft)}
.stamp{position:fixed;z-index:90;left:50%;top:40%;pointer-events:none;font-family:var(--f-sign);font-size:clamp(40px,8vw,84px);letter-spacing:.06em;color:var(--sticker);border:6px solid var(--sticker);padding:0 18px;border-radius:6px;background:rgba(228,212,177,.9);animation:stamp 1.1s ease-out forwards;white-space:nowrap}
.stamp.miss{color:var(--ink-soft);border-color:var(--ink-soft)}
.stamp.in{color:var(--link);border-color:var(--link)}
.stamp span{display:inline-block;animation:kt-in .3s cubic-bezier(.2,.9,.3,1.4) both;animation-delay:calc(var(--i)*50ms)}
@keyframes stamp{0%{transform:translate(-50%,-50%) rotate(-14deg) scale(2.2);opacity:0}18%{transform:translate(-50%,-50%) rotate(-8deg) scale(1);opacity:1}75%{opacity:1}100%{transform:translate(-50%,-60%) rotate(-8deg) scale(1);opacity:0}}
.report{display:grid;gap:18px}
.report h3{font-size:26px}
.nums{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:12px}
.num{border-top:2px solid var(--ink);padding-top:6px}
.num small{display:block;font-size:12px;color:var(--ink-soft)}
.num b{font-family:var(--f-dot);font-weight:400;font-size:28px;font-variant-numeric:tabular-nums}
.bars{display:flex;align-items:flex-end;gap:6px;height:130px;border-bottom:1.5px solid var(--ink);padding:0 2px}
.bars div{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;height:100%;gap:2px;font-size:11px}
.bars i{display:block;width:100%;background:var(--ink);border-radius:2px 2px 0 0;height:0;transition:height .7s cubic-bezier(.2,.9,.3,1)}
.bars i.pk{background:var(--sticker)}
.bars em{font-style:normal;font-family:var(--f-dot)}
.hours{display:flex;gap:6px;padding:0 2px;font-size:11px;color:var(--ink-soft)}
.hours span{flex:1;text-align:center}
.pause-veil .modal{grid-template-columns:1fr;text-align:center;width:min(380px,100%)}

/* ===== バックヤードPC ===== */
.pc{position:fixed;inset:0;z-index:60;background:#191f1c;display:grid;place-items:center;padding:14px max(14px,env(safe-area-inset-left,0px));animation:fade .2s}
.bezel{width:min(1100px,100%);height:min(720px,100%);background:var(--bezel);border-radius:14px;padding:16px 16px 28px;box-shadow:0 0 0 2px #a99f88 inset,0 20px 50px rgba(0,0,0,.5);position:relative;display:flex}
.bezel::after{content:"";position:absolute;bottom:9px;left:50%;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 6px var(--ok);transform:translateX(-50%)}
.screen{flex:1;min-width:0;background:var(--desk);border-radius:4px;overflow:hidden;display:grid;grid-template-rows:1fr auto;position:relative;color:var(--chalk);
  background-image:radial-gradient(circle at 80% 20%,rgba(255,255,255,.06),transparent 40%)}
.desktop{position:relative;min-height:0;padding:14px;display:grid;grid-template-columns:auto 1fr;gap:14px}
.icons{display:flex;flex-direction:column;gap:10px;align-items:center}
.icon{width:86px;background:none;border:1px solid transparent;border-radius:3px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:6px;font-size:12px;color:var(--chalk)}
.icon:hover,.icon.on{background:rgba(255,255,255,.1);border-color:rgba(255,255,255,.2)}
.icon .g{width:44px;height:44px;border-radius:6px;display:grid;place-items:center;font-family:var(--f-sign);font-size:18px;color:var(--ink)}
.desk-empty{align-self:center;justify-self:center;font-family:var(--f-dot);color:rgba(238,240,230,.45);text-align:center;font-size:14px}
.window{min-width:0;min-height:0;background:var(--win);color:var(--win-ink);border-radius:4px;display:grid;grid-template-rows:auto auto 1fr;box-shadow:0 10px 30px rgba(0,0,0,.35);animation:win-in .2s ease-out;overflow:hidden}
@keyframes win-in{from{opacity:0;transform:scale(.96) translateY(8px)}}
.titlebar{display:flex;align-items:center;gap:8px;padding:6px 10px;background:#d8d2c3;font-size:13px}
.titlebar b{flex:1;font-weight:700}
.titlebar button{width:22px;height:22px;border-radius:3px;border:1px solid #a9a191;background:var(--win);line-height:1;font-size:13px}
.urlbar{display:flex;gap:6px;padding:6px 10px;border-bottom:1px solid var(--win-line);font-family:var(--f-dot);font-size:12.5px;color:#5c6168;background:#ece8de}
.urlbar span{flex:1;background:#fff;border:1px solid var(--win-line);border-radius:3px;padding:1px 8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.page{overflow:auto;min-height:0;position:relative}
.taskbar{display:flex;align-items:center;gap:12px;padding:6px 12px;background:var(--desk-2);font-size:13px;flex-wrap:wrap}
.taskbar .clk{font-family:var(--f-dot);font-size:16px;color:var(--pop)}
.taskbar .front{margin-right:auto}
.taskbar .front.warn{color:#f3a28f;animation:blink 1s steps(2) infinite}
@keyframes blink{50%{opacity:.45}}
.taskbar .money{font-family:var(--f-dot)}

/* 卸サイト「ミナト音盤卸」 */
.site{--s-ink:#1f2a33;--s-accent:#c4372b;--s-soft:#e9e4d8;font-size:14px;color:var(--s-ink);min-height:100%;position:relative}
.s-head{position:sticky;top:0;z-index:5;display:flex;align-items:center;gap:12px;padding:10px 14px;background:var(--s-ink);color:#f4efe2}
.burger{width:36px;height:32px;background:none;border:0;display:flex;flex-direction:column;justify-content:center;gap:5px;padding:4px 6px}
.burger i{display:block;height:2px;background:currentColor;border-radius:2px;transition:transform .25s,opacity .2s}
.burger[aria-expanded="true"] i:nth-child(1){transform:translateY(7px) rotate(45deg)}
.burger[aria-expanded="true"] i:nth-child(2){opacity:0}
.burger[aria-expanded="true"] i:nth-child(3){transform:translateY(-7px) rotate(-45deg)}
.s-logo{font-family:var(--f-sign);font-size:17px;letter-spacing:.04em;margin-right:auto}
.s-logo small{font-family:var(--f-body);font-size:11px;opacity:.7;margin-left:6px}
.s-cart{background:var(--s-accent);border:0;color:#fff;border-radius:3px;padding:4px 10px;font-size:13px}
.drawer{position:absolute;z-index:6;top:52px;left:0;bottom:0;width:240px;background:#fffdf7;border-right:1px solid var(--win-line);box-shadow:6px 0 20px rgba(0,0,0,.15);padding:10px 0;transform:translateX(-105%);transition:transform .28s cubic-bezier(.2,.8,.3,1);overflow:auto}
.drawer.open{transform:none}
.drawer h4{margin:10px 16px 4px;font-size:11px;letter-spacing:.12em;color:#7a7f86;font-weight:400}
.drawer button{display:block;width:100%;text-align:left;background:none;border:0;padding:7px 16px;font-size:14px}
.drawer button:hover{background:var(--s-soft)}
.drawer-shade{position:absolute;inset:52px 0 0 0;z-index:5;background:rgba(0,0,0,.18)}
.s-body{padding:12px 16px 30px;display:flex;flex-direction:column;gap:16px}
.s-crumbs{display:flex;flex-wrap:wrap;gap:6px;font-size:12.5px;color:#6b7076;list-style:none;margin:0;padding:0}
.s-crumbs li+li::before{content:"›";margin-right:6px}
.s-crumbs button{background:none;border:0;padding:0;color:var(--link);text-decoration:underline}
.s-crumbs [aria-current]{color:var(--s-ink)}
.s-h{font-family:var(--f-sign);font-weight:400;font-size:18px;margin:0}
.carousel{position:relative;border-radius:4px;overflow:hidden;background:var(--s-ink);color:#f4efe2}
.c-track{display:flex;transition:transform .5s cubic-bezier(.3,.8,.3,1)}
.c-slide{flex:0 0 100%;display:grid;grid-template-columns:150px 1fr;gap:18px;padding:18px 54px;align-items:center;min-width:0}
.c-slide .cover{width:150px;max-width:100%;aspect-ratio:1;box-shadow:6px 6px 0 rgba(0,0,0,.35);transform:rotate(-2deg)}
.c-slide .cover svg{width:100%;height:100%;display:block}
.c-slide .lbl{font-family:var(--f-hand);color:var(--pop);font-size:15px}
.c-slide h5{margin:2px 0 6px;font-family:var(--f-sign);font-weight:400;font-size:20px;line-height:1.3}
.c-slide p{margin:0 0 10px;font-size:13px;opacity:.85}
.c-slide .sbtn{background:#f4efe2;color:var(--s-ink);border:0;border-radius:3px;padding:5px 12px;font-weight:700}
.c-arrow{position:absolute;top:50%;transform:translateY(-50%);width:34px;height:34px;border-radius:50%;border:0;background:rgba(244,239,226,.9);color:var(--s-ink);font-size:18px}

  [5,'Slow Burn',2013,3300,['夜','泣ける'],['Slow Burn','Candle Talk',"Don't Leave at Nine",'Velvet Rain']],

  [6,'霧笛',2019,2900,['静か','作業用'],['霧笛','灯室','潮見表','無線']],
  [6,'雨の観測記録',2021,3100,['雨','静か','作業用'],['観測1','観測2（強雨）','観測3','観測終了']],
  [6,'夜明け前の海',2024,3300,['朝','静か'],['4:12','薄明','海鳥','日の出']],
  [7,'狛犬ダンスフロア',2020,3200,['踊れる','熱い'],['参道','狛犬ダンスフロア','鈴の音リミックス','お賽銭']],
  [7,'首都高ナイトレース',2022,3400,['ドライブ','夜','熱い'],['C1','首都高ナイトレース','パーキングエリア','朝焼けの出口']],
  [7,'深夜作業ループ',2023,2800,['作業用','夜'],['loop_01','loop_02','loop_03','セーブして寝る']],
  [8,'砂嵐',2011,2700,['熱い','ドライブ'],['砂嵐','アクセル','錆びたギター','ガレージに帰る']],
  [8,'放課後スピーカー',2014,2900,['懐かしい','熱い'],['放課後スピーカー','屋上','文化祭前夜','卒業']],
  [8,'泣き虫ディストーション',2017,3100,['泣ける','雨'],['泣き虫ディストーション','雨のライブハウス','アンコール','帰り道']],
  // ここから卸サイトで初めて仕入れられる新譜
  [9,'給湯室のスロウジャム',2025,3400,['夜','静か'],['給湯室のスロウジャム','ポットの湯気','残業の灯り','おつかれさま']],
  [9,'定時退社',2025,3000,['踊れる','熱い'],['17:59','定時退社','改札ダッシュ','金曜日のフロア']],
  [9,'有給休暇',2026,3600,['朝','ドライブ'],['目覚ましを止める','有給休暇','海沿いのSA','明日も休み']],
  [10,'Lantern Street',2016,3200,['夜','懐かしい'],['Lantern Street','Paper Moon Café','Old Postcards','Walk Me Home']],
  [10,'Rain Letters',2018,3000,['雨','泣ける'],['Rain Letters','Ink Runs','Window Seat','Unsent']],
  [10,'Morning Bicycle',2021,2900,['朝','ドライブ'],['Morning Bicycle','Bakery Corner','Downhill','Bell']],
].map((r,i)=>({id:i+1,artistId:r[0],title:r[1],year:r[2],price:r[3],cost:Math.round(r[3]*.55/10)*10,tags:r[4],tracks:r[5]}));
const STARTER_IDS = ALBUMS.filter(a=>a.artistId<=8).map(a=>a.id);
const FEATURED = [25,28,26,29,20,6]; // 卸サイトのカルーセル
const CRATES = [
  {id:'A', name:'邦楽',          pop:'邦楽いろいろ',  artists:[1,2,4,8,9]},
  {id:'B', name:'洋楽',          pop:'海の向こうから',artists:[3,5,10]},
  {id:'C', name:'インスト・電子',pop:'歌なしもあり',  artists:[6,7]},
];
const CUSTOMER_TYPES = [
  {id:1, name:'学生',           color:'#f0cf4a', budget:3000, patience:30, likes:['熱い','踊れる','懐かしい','泣ける']},
  {id:2, name:'会社員',         color:'#9fc3d6', budget:4000, patience:24, likes:['夜','作業用','ドライブ','静か']},
  {id:3, name:'常連のおじさん', color:'#c9b08a', budget:5000, patience:45, likes:['懐かしい','静か','雨']},
  {id:4, name:'カップル',       color:'#e8a0a8', budget:4500, patience:34, likes:['夜','ドライブ','泣ける']},
  {id:5, name:'DJ',             color:'#5bd1b5', budget:4000, patience:20, likes:['踊れる','熱い','夜']},
  {id:6, name:'喫茶店のマスター',color:'#d9b46a',budget:4500, patience:40, likes:['朝','静か','作業用','雨']},
];
// 営業時間の延長（UPGRADE）。レベルnで閉店が 15+n 時
const HOURS_COST = [15000, 30000, 50000, 80000];
const artistOf = a => ARTISTS.find(x=>x.id===a.artistId);
const albumById = id => ALBUMS.find(a=>a.id===id);

/* =========================================================
   時間：ゲーム内1分 ≒ 3.3秒（10:00〜15:00で約17分、延長すると伸びる）
   ========================================================= */
const OPEN_MIN = 10*60, BASE_CLOSE = 15*60, MAX_CLOSE = 19*60;
const REAL_MS_PER_GAME_MIN = (30*60*1000) / (MAX_CLOSE-OPEN_MIN);
const SAVE_KEY = 'rojiakari.v1';
const PER_PAGE = 8;
const DEBUG = new URLSearchParams(location.search).has('debug');

/* =========================================================
   状態（SHOP / STOCK / VISIT / DAY_REPORT / PURCHASE）
   ========================================================= */
function freshState(){
  const stock = {};
  ALBUMS.forEach(a=>{ stock[a.id] = STARTER_IDS.includes(a.id) ? 2 + (a.id*7)%3 : 0; });
  return migrate({
    v:2, day:1, money:20000, rep:0, phase:'prep', clock:OPEN_MIN,
    stock, queue:[], nextCustomerAt:OPEN_MIN+3, custSeq:0, selectedId:null,
    today:freshToday(), lastReport:null, log:[]
  });
}
function migrate(s){
  s.v = 2;
  if (s.hoursLv == null) s.hoursLv = 0;
  if (!Array.isArray(s.carried)) s.carried = STARTER_IDS.slice();
  if (!Array.isArray(s.cart)) s.cart = [];
  if (!Array.isArray(s.purchases)) s.purchases = [];
  ALBUMS.forEach(a=>{ if (s.stock[a.id] == null) s.stock[a.id] = 0; });
  if (s.today && s.today.spent == null) s.today.spent = 0;
  return s;
}
function freshToday(){ return {sales:0, spent:0, visitors:0, served:0, lost:0, repStart:0, hourly:Array(9).fill(0)}; }
const closeMin = () => BASE_CLOSE + S.hoursLv*60;
let S = (()=>{ const l = load(); return l ? migrate(l) : freshState(); })();
function load(){ try{ const t = localStorage.getItem(SAVE_KEY); return t ? JSON.parse(t) : null; }catch(e){ return null; } }
function save(){ try{ localStorage.setItem(SAVE_KEY, JSON.stringify(S)); }catch(e){} }

function rng(seed){ let s = seed>>>0 || 1; return ()=>{ s ^= s<<13; s>>>=0; s ^= s>>17; s ^= s<<5; s>>>=0; return s/4294967296; }; }
const rand = Math.random;
const pick = arr => arr[Math.floor(rand()*arr.length)];
const yen = n => '¥' + Math.round(n).toLocaleString('ja-JP');
const hhmm = m => `${String(Math.floor(m/60)).padStart(2,'0')}:${String(Math.floor(m%60)).padStart(2,'0')}`;
const esc = s => String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

/* =========================================================
   ジャケット生成（手描き風に少しずつ歪ませる）
   ========================================================= */
const coverCache = {};
function coverSVG(album){
  if (coverCache[album.id]) return coverCache[album.id];
  const ar = artistOf(album), r = rng(album.id*9973 + 17);
  const c = ar.color, ink = '#1e1a14', paper = ['#efe3c8','#e7dcc6','#f2e9d4'][album.id%3];
  const j = (v,amt)=> v + (r()-.5)*amt;
  let g = '';
  const bgDark = album.id % 2 === 0;
  const bg = bgDark ? ink : paper, fg = bgDark ? paper : ink;
  switch(ar.style){
    case 'dots': for(let y=10;y<100;y+=11) for(let x=10;x<100;x+=11){ const rr = 1 + 4*Math.abs(Math.sin((x+y+album.id*13)/23)); g += `<circle cx="${j(x,2)}" cy="${j(y,2)}" r="${rr.toFixed(1)}" fill="${c}"/>`; } break;
    case 'sun': g += `<circle cx="${j(50,10)}" cy="${j(48,8)}" r="${j(26,6)}" fill="${c}"/>`; for(let i=0;i<5;i++) g += `<rect x="0" y="${58+i*8}" width="100" height="${3+i}" fill="${bg}"/>`; break;
    case 'waves': for(let i=0;i<7;i++){ const y=20+i*11; g += `<path d="M-5 ${y} Q 20 ${j(y-8,6)} 45 ${y} T 105 ${y}" stroke="${i%2?c:fg}" stroke-width="${j(3,2)}" fill="none"/>`; } break;
    case 'rails': g += `<rect x="${j(36,6)}" y="0" width="4" height="100" fill="${c}"/><rect x="${j(60,6)}" y="0" width="4" height="100" fill="${c}"/>`; for(let y=6;y<100;y+=12) g += `<rect x="28" y="${j(y,3)}" width="${j(46,6)}" height="3" fill="${fg}" transform="rotate(${j(0,4)} 50 ${y})"/>`; break;
    case 'rings': for(let i=6;i>0;i--) g += `<circle cx="${j(50,4)}" cy="${j(50,4)}" r="${i*7}" fill="none" stroke="${i%2?c:fg}" stroke-width="${j(3,2)}"/>`; break;
    case 'fog': for(let i=0;i<9;i++) g += `<rect x="${j(-10,20)}" y="${10+i*9}" width="${j(90,40)}" height="${j(5,3)}" rx="2" fill="${c}" opacity="${(.25+r()*.6).toFixed(2)}"/>`; g += `<rect x="${j(70,8)}" y="${j(40,10)}" width="6" height="40" fill="${fg}"/>`; break;
    case 'grid': for(let x=0;x<100;x+=12.5) g += `<line x1="${x}" y1="0" x2="${j(x,10)}" y2="100" stroke="${c}" stroke-width="1"/>`; for(let y=0;y<100;y+=12.5) g += `<line x1="0" y1="${y}" x2="100" y2="${j(y,10)}" stroke="${c}" stroke-width="1"/>`; g += `<rect x="${j(30,20)}" y="${j(30,20)}" width="${j(30,10)}" height="${j(30,10)}" fill="${c}"/>`; break;
    case 'noise': for(let i=0;i<70;i++) g += `<rect x="${(r()*100).toFixed(1)}" y="${(r()*100).toFixed(1)}" width="${(2+r()*14).toFixed(1)}" height="${(1+r()*3).toFixed(1)}" fill="${r()<.5?c:fg}"/>`; break;
  }
  const label = esc(album.title.length>12 ? album.title.slice(0,12)+'…' : album.title);
  const tx = j(8,3), ty = 92;
  const svg = `<svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${esc(album.title)}のジャケット"><rect width="100" height="100" fill="${bg}"/>${g}<rect x="${tx-2}" y="${ty-9}" width="${Math.min(label.length*6.4+4,90)}" height="12" fill="${bg}" opacity=".85" transform="rotate(${j(0,3)} ${tx} ${ty})"/><text x="${tx}" y="${ty}" font-size="8" fill="${fg}" font-family="Zen Kurenaido, sans-serif" transform="rotate(${j(0,3)} ${tx} ${ty})">${label}</text></svg>`;
  return coverCache[album.id] = svg;
}

/* =========================================================
   客
   ========================================================= */
function makeRequest(type){
  const likes = type.likes.slice();
  const n = rand() < .45 ? 2 : 1;
  const tags = [];
  while (tags.length < n && likes.length){ tags.push(likes.splice(Math.floor(rand()*likes.length),1)[0]); }
  const text = tags.length === 2
    ? `${TAGS[tags[0]].a}んですけど、${TAGS[tags[1]].n}ってあります？`
    : `${TAGS[tags[0]].n}、ありますか？`;
  return {tags, text};
}
function spawnCustomer(){
  const type = pick(CUSTOMER_TYPES);
  const req = makeRequest(type);
  S.custSeq++;
  S.today.visitors++;
  S.today.hourly[Math.min(8, Math.floor((S.clock-OPEN_MIN)/60))]++;
  if (S.queue.length >= 5){ S.today.lost++; addLog(`${type.name}が店の混雑を見て帰った`, 'b'); return; }
  const budget = Math.round((type.budget + (rand()-.4)*1200)/100)*100;
  const c = {id:S.custSeq, typeId:type.id, tags:req.tags, text:req.text, budget, patience:type.patience, maxPatience:type.patience};
  S.queue.push(c);
  if (S.selectedId == null) S.selectedId = c.id;
}
function arrivalGap(){
  const hour = Math.floor(S.clock/60);
  const rush = (hour===12 || hour===17 || hour===18) ? .6 : 1;
  const repBoost = 1 + Math.max(-.4, S.rep/60);
  return Math.max(3, 13 * rush / repBoost * (.6 + rand()*.8));
}
const typeOf = c => CUSTOMER_TYPES.find(t=>t.id===c.typeId);

/* =========================================================
   進行
   ========================================================= */
let speed = 1, paused = false, acc = 0, lastT = 0, pcOpen = false;
function tick(t){
  if (!lastT) lastT = t;
  const dt = Math.min(1000, t - lastT); lastT = t;
  if (S.phase === 'open' && !paused){
    acc += dt * speed;
    while (acc >= REAL_MS_PER_GAME_MIN && S.phase === 'open'){ acc -= REAL_MS_PER_GAME_MIN; stepMinute(); }
    renderClockOnly();
  }
  requestAnimationFrame(tick);
}
function stepMinute(){
  S.clock++;
  // PCに向かっている間は店頭が無人なので、客の我慢が早く減る
  const drain = pcOpen ? 1.5 : 1;
  for (const c of S.queue.slice()){
    c.patience -= drain;
    if (c.patience <= 0){
      S.queue = S.queue.filter(x=>x!==c);
      S.today.lost++; S.rep = Math.max(-50, S.rep-2);
      addLog(`${typeOf(c).name}が待ちきれずに帰った`, 'b');
      if (S.selectedId === c.id) S.selectedId = S.queue[0]?.id ?? null;
    }
  }
  if (S.clock >= S.nextCustomerAt && S.clock < closeMin() - 5){
    spawnCustomer();
    S.nextCustomerAt = S.clock + arrivalGap();
  }
  if (S.clock >= closeMin()){ closeShop(); return; }
  if (S.clock % 5 === 0) save();
  renderCounter();
  if (pcOpen) renderTaskbar();
}
function openShop(){
  S.phase = 'open'; S.clock = OPEN_MIN; S.queue = []; S.selectedId = null;
  S.today = freshToday(); S.today.repStart = S.rep;
  S.nextCustomerAt = OPEN_MIN + 2; acc = 0; paused = false;
  addLog(`DAY ${S.day} 開店（〜${hhmm(closeMin())}）`, 'g');
  save(); renderAll();
}
function closeShop(){
  S.clock = closeMin();
  const left = S.queue.length;
  if (left){ S.today.lost += left; addLog(`閉店。並んでいた${left}人には帰ってもらった`, 'b'); }
  S.queue = []; S.selectedId = null; S.phase = 'closed';
  S.lastReport = {day:S.day, ...S.today, repEnd:S.rep, money:S.money, hours:(closeMin()-OPEN_MIN)/60};
  save(); leavePC(); renderAll(); showReport();
}
function nextDay(){ S.day++; S.phase = 'prep'; S.clock = OPEN_MIN; S.log = []; save(); closeModal(); renderAll(); }

/* =========================================================
   接客
   ========================================================= */
function handOver(albumId){
  const c = S.queue.find(x=>x.id===S.selectedId);
  const al = albumById(albumId);
  if (!c || S.phase!=='open' || S.stock[albumId] <= 0) return;
  const t = typeOf(c);
  if (al.price > c.budget){
    c.patience = Math.max(1, c.patience-5);
    sayReaction(c, 'ちょっと予算オーバーで……'); stamp('予算外','miss'); save(); renderCounter(); return;
  }
  const hit = c.tags.filter(tg=>al.tags.includes(tg)).length;
  if (hit === 0){
    c.patience = Math.max(1, c.patience-6); S.rep = Math.max(-50, S.rep-1);
    sayReaction(c, 'うーん、ちょっと違うかな……'); stamp('ちがう','miss'); save(); renderCounter(); return;
  }
  const perfect = hit === c.tags.length;
  const tip = perfect ? Math.round(al.price*.1/10)*10 : 0;
  S.money += al.price + tip; S.today.sales += al.price + tip; S.today.served++;
  S.stock[albumId]--; S.rep = Math.min(100, S.rep + (perfect?2:1));
  addLog(`${t.name}に「${al.title}」 ${yen(al.price)}${tip?` ＋心付け${yen(tip)}`:''}`, 'g');
  S.queue = S.queue.filter(x=>x!==c);
  S.selectedId = S.queue[0]?.id ?? null;
  stamp(perfect ? 'SOLD!' : 'まいど');
  save(); closeModal(); renderAll();
}

function renderFloor(){

function pagerHTML(cur, pages, attr){
  if (pages <= 1) return '';
  let h = `<button data-${attr}="${cur-1}" ${cur===1?'disabled':''} aria-label="前のページ">‹</button>`;
  for (let i=1;i<=pages;i++) h += `<button data-${attr}="${i}" ${i===cur?'aria-current="page"':''}>${i}</button>`;
  return h + `<button data-${attr}="${cur+1}" ${cur===pages?'disabled':''} aria-label="次のページ">›</button>`;
}

  let body = '';
  if (pcv.page==='top') body = siteTop();
  if (pcv.page==='artist') body = siteArtist();
  if (pcv.page==='album') body = siteAlbum();
  if (pcv.page==='cart') body = siteCart();
  const labels = [...new Set(ARTISTS.map(a=>a.label))];
  return `<div class="site">
    <div class="s-head">
      <button class="burger" data-burger aria-label="メニュー" aria-expanded="${pcv.menu}"><i></i><i></i><i></i></button>
      <span class="s-logo">ミナト音盤卸<small>業者専用・当日入荷</small></span>
      <button class="s-cart" data-sgo="cart">カート ${cartCount()}</button>
    </div>
    ${pcv.menu ? '<div class="drawer-shade" data-burger></div>' : ''}
    <nav class="drawer ${pcv.menu?'open':''}" aria-label="サイトメニュー" ${pcv.menu?'':'inert'}>
      <button data-sgo="top">トップ</button>
      <button data-sgo="cart">カート（${cartCount()}点）</button>
      ${labels.map(l=>`<h4>${esc(l)}</h4>${ARTISTS.filter(a=>a.label===l).map(a=>`<button data-sartist="${a.id}">${esc(a.name)}</button>`).join('')}`).join('')}
    </nav>
    <div class="s-body">
      <ol class="s-crumbs">${crumbs.join('')}</ol>
      ${pcv.msg ? `<div class="s-msg">${esc(pcv.msg)}</div>` : ''}
      ${body}
    </div></div>`;
}
function siteTop(){
  const slides = FEATURED.map(id=>{
    const a = albumById(id), ar = artistOf(a), isNew = !S.carried.includes(id);
    return `<div class="c-slide" aria-hidden="true">
      <span class="cover">${coverSVG(a)}</span>
      <div><div class="lbl">${isNew ? '新規取扱のおすすめ' : '定番の補充に'}</div>
      <h5>${esc(a.title)}</h5><p>${esc(ar.name)}／${esc(ar.genre)}／卸値 ${yen(a.cost)}（店頭 ${yen(a.price)}）</p>
      <button class="sbtn" data-salbum="${id}">詳しく見る</button></div></div>`;
  }).join('');
  return `<div class="carousel" id="carousel" aria-roledescription="カルーセル" aria-label="特集">
      <div class="c-track" style="transform:translateX(${-pcv.slide*100}%)">${slides}</div>
      <button class="c-arrow prev" data-slide="${pcv.slide-1}" aria-label="前へ">‹</button>
      <button class="c-arrow next" data-slide="${pcv.slide+1}" aria-label="次へ">›</button>
      <div class="c-dots">${FEATURED.map((_,i)=>`<button data-slide="${i}" aria-label="${i+1}枚目" aria-current="${i===pcv.slide}"></button>`).join('')}</div>
    </div>
    <h3 class="s-h">アーティストから探す</h3>
    <div class="s-artists">${ARTISTS.map(a=>{
      const n = ALBUMS.filter(x=>x.artistId===a.id).length, carried = ALBUMS.filter(x=>x.artistId===a.id && S.carried.includes(x.id)).length;
      return `<button class="s-artist" data-sartist="${a.id}"><i style="background:${a.color}"></i><span><b>${esc(a.name)}</b><small>${esc(a.genre)}・${n}タイトル${carried? '' : '・未取扱'}</small></span></button>`;
    }).join('')}</div>
    <p class="s-note">ご注文は即時発送。お店に当日入荷します。</p>`;
}
function siteArtist(){
  const ar = ARTISTS.find(a=>a.id===pcv.artistId);
  const list = ALBUMS.filter(a=>a.artistId===ar.id);
  return `<h3 class="s-h">${esc(ar.name)}</h3><p class="s-note">${esc(ar.genre)}／レーベル：${esc(ar.label)}</p>
    <div class="s-list">${list.map(a=>`<button class="s-item" data-salbum="${a.id}"><span class="cover">${coverSVG(a)}</span>
      ${S.carried.includes(a.id) ? `<span class="badge">店の在庫 ${S.stock[a.id]}枚</span>` : `<span class="badge new">未取扱</span>`}
      <b>${esc(a.title)}</b><span class="ws">卸値 ${yen(a.cost)}</span></button>`).join('')}</div>`;
}
function siteAlbum(){
  const a = albumById(pcv.albumId), ar = artistOf(a);
  const qtyOpts = [1,2,3,4,5].map(n=>[n, `${n}枚（${yen(a.cost*n)}）`]);
  return `<div class="s-detail"><span class="cover">${coverSVG(a)}</span><div>
    <h3 class="s-h">${esc(a.title)}</h3><p class="s-note">${esc(ar.name)}（${a.year}）・${esc(ar.label)}</p>
    <div class="chips"><span class="chip g">${esc(ar.genre)}</span>${a.tags.map(t=>`<span class="chip">${esc(t)}</span>`).join('')}</div>
    <table class="s-table"><tr><th>卸値</th><td class="n">${yen(a.cost)}</td></tr><tr><th>店頭価格</th><td class="n">${yen(a.price)}</td></tr><tr><th>1枚の利益</th><td class="n">${yen(a.price-a.cost)}</td></tr><tr><th>店の在庫</th><td class="n">${S.carried.includes(a.id) ? S.stock[a.id]+'枚' : '未取扱'}</td></tr></table>
    ${accordion('accSite', `収録曲（${a.tracks.length}曲）`, `<ol>${a.tracks.map(t=>`<li>${esc(t)}</li>`).join('')}</ol>`)}
    <div class="s-buy">${dropdown('qty','数量', qtyOpts, pcv.qty, 'pc')}<button class="s-primary" data-addcart="${a.id}">カートに入れる</button></div>
  </div></div>`;
}
function siteCart(){
  if (!S.cart.length) return `<h3 class="s-h">カート</h3><p class="s-note">カートは空です。</p>`;
  const total = S.cart.reduce((s,l)=>s+albumById(l.id).cost*l.qty,0);
  return `<h3 class="s-h">カート</h3>
    <div style="overflow-x:auto"><table class="s-table"><thead><tr><th>タイトル</th><th>数量</th><th style="text-align:right">小計</th><th></th></tr></thead><tbody>
    ${S.cart.map(l=>{ const a = albumById(l.id); return `<tr><td>${esc(a.title)}<br><span class="s-note">${esc(artistOf(a).name)}</span></td><td>${l.qty}枚</td><td class="n">${yen(a.cost*l.qty)}</td><td><button data-rmcart="${l.id}">削除</button></td></tr>`; }).join('')}
    </tbody></table></div>
    <div class="s-total"><span>所持金 ${yen(S.money)}</span><span>合計 <b>${yen(total)}</b></span>
      <button class="s-primary" data-order ${total>S.money?'disabled':''}>注文を確定する（即時入荷）</button></div>
    ${total>S.money ? '<p class="s-msg">所持金が足りません。</p>' : ''}`;
}
function addToCart(id){
  const l = S.cart.find(x=>x.id===id);
  if (l) l.qty = Math.min(20, l.qty + pcv.qty); else S.cart.push({id, qty:pcv.qty});
  pcv.msg = `「${albumById(id).title}」を${pcv.qty}枚カートに入れました`;
  save(); renderPC();
}
function placeOrder(){
  const total = S.cart.reduce((s,l)=>s+albumById(l.id).cost*l.qty,0);
  if (!S.cart.length || total > S.money) return;
  let newTitles = 0;
  S.cart.forEach(l=>{
    if (!S.carried.includes(l.id)){ S.carried.push(l.id); newTitles++; }
    S.stock[l.id] += l.qty;
    S.purchases.push({day:S.day, albumId:l.id, qty:l.qty});
  });
  S.money -= total; S.today.spent = (S.today.spent||0) + total;
  addLog(`仕入れ ${cartCount()}枚 ${yen(total)}${newTitles?`（新規取扱 ${newTitles}タイトル）`:''}`, 'g');
  S.cart = []; pcv.msg = '入荷しました。棚に並べてあります。'; pcv.page = 'top';
  stamp('入荷', 'in');
  save(); renderAll();
}

function equipHTML(){
  const lv = S.hoursLv, max = HOURS_COST.length;
  const next = lv < max ? HOURS_COST[lv] : null;
  const canBuy = next != null && S.money >= next && S.phase !== 'open';
  const why = next == null ? '最大まで延長済みです' : S.phase === 'open' ? '営業中は変更できません。閉店後か開店前に。' : S.money < next ? '所持金が足りません' : '';
  return `<div class="tool-app">
    <h4>店舗設備</h4>
    <div class="upg">${accordion('upgHours', `営業時間の延長<small>いま 10:00〜${hhmm(closeMin())}</small>`,
      `<p>閉店を1時間遅くします。営業が長いほど来客は増えますが、そのぶん店頭に立つ時間も伸びます。</p>
       <div class="lv">${Array.from({length:max},(_,i)=>`<i class="${i<lv?'on':''}"></i>`).join('')}</div>
       ${next!=null ? `<p>次：〜${hhmm(closeMin()+60)}　費用 <b>${yen(next)}</b></p>` : ''}
       <button class="s-primary" data-buyhours ${canBuy?'':'disabled'}>延長する</button>
       ${why ? `<p class="s-note">${esc(why)}</p>` : ''}`)}</div>
    <div class="upg">${accordion('upgSoon', `求人・雇用<small>準備中</small>`, `<p>店員を雇うと、PCに向かっている間も店頭が回るようになります（次のバージョンで追加）。</p>`)}</div>
  </div>`;
}
function buyHours(){
  const cost = HOURS_COST[S.hoursLv];
  if (cost == null || S.money < cost || S.phase === 'open') return;
  S.money -= cost; S.hoursLv++;
  addLog(`営業時間を〜${hhmm(closeMin())}に延長（${yen(cost)}）`, 'g');
  stamp('延長', 'in');
  save(); renderAll();
}

/* カルーセルの自動送り（PCでトップを開いている時だけ） */
setInterval(()=>{
  if (pcOpen && pcv.app==='shop' && pcv.page==='top' && !pcv.menu && !document.querySelector('#carousel:hover')){
    pcv.slide = (pcv.slide + 1) % FEATURED.length;
    const tr = document.querySelector('#carousel .c-track');
    if (tr){ tr.style.transform = `translateX(${-pcv.slide*100}%)`; document.querySelectorAll('#carousel .c-dots button').forEach((b,i)=>b.setAttribute('aria-current', String(i===pcv.slide))); }
    document.querySelectorAll('#carousel .c-arrow.prev').forEach(b=>b.dataset.slide = pcv.slide-1);
    document.querySelectorAll('#carousel .c-arrow.next').forEach(b=>b.dataset.slide = pcv.slide+1);
  }
}, 5000);

/* =========================================================
   操作
   ========================================================= */
function sgo(page, extra={}){ Object.assign(pcv, {page, menu:false, msg:'', qty:1}, extra); renderPC(); const pg = document.querySelector('#desktop .page'); if (pg) pg.scrollTop = 0; }
document.addEventListener('click', e=>{
  const t = e.target;
  const dd = t.closest('.dd');
  if (dd){
    if (t.closest('.dd-btn')){
      const open = !dd.classList.contains('open');
      closeDropdowns(dd);
      dd.classList.toggle('open', open);
      dd.querySelector('.dd-list').hidden = !open;
      dd.querySelector('.dd-btn').setAttribute('aria-expanded', String(open));
      return;
    }
    const opt = t.closest('[data-val]');
    if (opt){
      if (dd.dataset.scope === 'pc'){ pcv[dd.dataset.dd] = +opt.dataset.val || opt.dataset.val; pcv.keepScroll = true; renderPC(); }
      else { view[dd.dataset.dd] = opt.dataset.val; view.page = 1; renderFloor(); }
      return;
    }
  } else closeDropdowns();

  // 店頭
  if (t.closest('[data-crumb="top"]')){ view.crate = null; view.page = 1; renderFloor(); return; }
  const cr = t.closest('[data-crate]'); if (cr){ view.crate = cr.dataset.crate; view.page = 1; view.genre = 'all'; renderFloor(); return; }
  const pg = t.closest('[data-page]'); if (pg && !pg.disabled){ view.page = +pg.dataset.page; renderFloor(); return; }
  const al = t.closest('[data-album]'); if (al){ openAlbum(+al.dataset.album); return; }
  const cu = t.closest('[data-cust]'); if (cu){ S.selectedId = +cu.dataset.cust; reactionFor = null; renderCounter(); return; }
  const ah = t.closest('[data-acc]');
  if (ah){ const open = ah.getAttribute('aria-expanded') !== 'true'; ah.setAttribute('aria-expanded', String(open)); $(ah.dataset.acc).classList.toggle('open', open); return; }
  if (t.id === 'btnHand' && modalAlbum){ handOver(modalAlbum); return; }
  if (t.closest('[data-close]') || t.hasAttribute('data-veil')){ closeModal(); return; }
  if (t.id === 'btnNext'){ nextDay(); return; }
  if (t.id === 'btnResume'){ paused = false; lastT = 0; $('modalRoot').innerHTML = ''; return; }
  const sp = t.closest('[data-speed]'); if (sp){ speed = +sp.dataset.speed; return; }

  // PC
  const app = t.closest('[data-app]'); if (app){ pcv.app = app.dataset.app; pcv.page = 'top'; pcv.menu = false; pcv.msg = ''; renderPC(); return; }
  if (t.closest('[data-winclose]')){ pcv.app = null; renderPC(); return; }
  if (t.closest('[data-burger]')){ pcv.menu = !pcv.menu; pcv.keepScroll = true; renderPC(); return; }
  const go = t.closest('[data-sgo]'); if (go){ sgo(go.dataset.sgo); return; }
  const sa = t.closest('[data-sartist]'); if (sa){ sgo('artist', {artistId:+sa.dataset.sartist}); return; }
  const sb = t.closest('[data-salbum]'); if (sb){ sgo('album', {albumId:+sb.dataset.salbum}); return; }
  const sl = t.closest('[data-slide]'); if (sl){ pcv.slide = (+sl.dataset.slide + FEATURED.length) % FEATURED.length; pcv.keepScroll = true; renderPC(); return; }
  const ac = t.closest('[data-addcart]'); if (ac){ addToCart(+ac.dataset.addcart); pcv.keepScroll = true; return; }
  const rm = t.closest('[data-rmcart]'); if (rm){ S.cart = S.cart.filter(l=>l.id!==+rm.dataset.rmcart); save(); pcv.keepScroll = true; renderPC(); return; }
  if (t.closest('[data-order]')){ placeOrder(); return; }
  if (t.closest('[data-buyhours]')){ buyHours(); return; }
});
$('btnMain').addEventListener('click', ()=>{ if (S.phase==='prep') openShop(); else if (S.phase==='closed') showReport(); });
$('btnPause').addEventListener('click', ()=>{ paused = true; showPause(); });
$('btnPC').addEventListener('click', openPC);
$('btnLeavePC').addEventListener('click', ()=>{ leavePC(); renderAll(); });
$('btnReset').addEventListener('click', ()=>{ try{ localStorage.removeItem(SAVE_KEY); }catch(e){} S = freshState(); view.crate=null; leavePC(); closeModal(); });
document.addEventListener('keydown', e=>{
  if (e.key !== 'Escape') return;
  if (document.querySelector('.dd.open')) closeDropdowns();
  else if (modalAlbum) closeModal();
  else if (pcOpen && pcv.menu){ pcv.menu = false; renderPC(); }
});
// 放置ゲームではないので、タブを離れたら自動で一時停止
document.addEventListener('visibilitychange', ()=>{
  if (document.hidden && S.phase==='open' && !paused){ paused = true; save(); showPause(); }
});
window.addEventListener('beforeunload', save);

/* 起動 */
if (DEBUG) $('debugBox').hidden = false;
if (S.phase === 'open'){ paused = true; renderAll(); showPause(); }
else { renderAll(); if (S.phase === 'closed') showReport(); }
requestAnimationFrame(tick);
</script>
</body>
</html>
